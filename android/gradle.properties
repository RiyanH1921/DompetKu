# Project-wide Gradle settings.

# Specifies the JDK version to use (JDK 24 is compatible with Gradle 8.14)
org.gradle.java.home=C:\\Program Files\\Java\\jdk-24

# Specifies the JVM arguments with low memory footprint so it fits in available RAM
org.gradle.jvmargs=-Xmx512m -XX:+UseSerialGC

# AndroidX package structure
android.useAndroidX=true
