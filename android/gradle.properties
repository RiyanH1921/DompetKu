# Project-wide Gradle settings.

# Specifies the JDK version to use (JDK 24 is compatible with Gradle 8.14)
org.gradle.java.home=C:\\Program Files\\Java\\jdk-24

# Specifies JVM arguments: 1024MB is optimal for low-RAM Windows machines without crashing
org.gradle.jvmargs=-Xmx1024m

# AndroidX package structure
android.useAndroidX=true
